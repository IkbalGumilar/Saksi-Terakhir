<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#080a0e">
    <title>Saksi Terakhir</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
        background: #080a0e; overflow: hidden; overscroll-behavior: none;
      }
      body {
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        display: flex; align-items: center; justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        border: 1.5px solid rgba(214, 196, 150, 0.28);
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.9);
        background: #000;
      }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: none; outline: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; text-align: center; color: #ddd; font-family: sans-serif; }
      #unity-progress-bar-empty { width: 220px; height: 8px; margin-top: 14px; background: #333; border-radius: 4px; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #d6c496; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 10; }
      #unity-fullscreen-button { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; z-index: 5; cursor: pointer; opacity: .55; border-radius: 8px; background: rgba(0,0,0,.55) url('TemplateData/fullscreen-button.png') no-repeat center / 22px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-text">Memuat Saksi Terakhir…</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button" title="Layar penuh"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Saksi-Terakhir.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Saksi-Terakhir.data.unityweb",
        frameworkUrl: buildUrl + "/Saksi-Terakhir.framework.js.unityweb",
        codeUrl: buildUrl + "/Saksi-Terakhir.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Saksi-Terakhir",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Simpan save game (autosave/slot) di IndexedDB browser.
      config.autoSyncPersistentDataPath = true;

      // Perangkat sentuh (termasuk iPadOS yang menyamar sebagai Mac): batasi resolusi render
      // agar HP layar padat (DPR 3x) tetap lancar.
      var isTouchDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints || 0) > 1;
      if (isTouchDevice) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      }

      // Cegah gestur browser (zoom/scroll/context menu) mengganggu kontrol virtual.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(n) {
        document.addEventListener(n, function(e) { e.preventDefault(); });
      });
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
